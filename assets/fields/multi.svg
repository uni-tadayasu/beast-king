    <radialGradient id="mirror"><stop stop-color="#98d4ef" stop-opacity=".18"/><stop offset="1" stop-color="#23547d" stop-opacity=".03"/></radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0v80" fill="none" stroke="#82bee0" stroke-opacity=".065"/><path d="m0 0 80 80m0-80L0 80" fill="none" stroke="#82bee0" stroke-opacity=".025"/></pattern>
    <g id="array" fill="none" stroke="#8bcae5">
