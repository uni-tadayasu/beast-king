  <g transform="translate(600 610) rotate(180)"><circle r="191" fill="url(#mirror)"/><use href="#array"/></g>
  <path d="m600 313 94 107-94 107-94-107z" fill="#173b54" fill-opacity=".55" stroke="url(#beam)" stroke-width="3"/>
  <path d="m600 347 64 73-64 73-64-73zM600 347v146m-64-73h128" fill="none" stroke="#9ad8ec" stroke-opacity=".33" stroke-width="1.5"/>
  <path d="m600 375 39 45-39 45-39-45z" fill="#8cc4df" fill-opacity=".07" stroke="#c0e5f0" stroke-opacity=".25"/>
  <g fill="#a5d7eb" fill-opacity=".38"><circle cx="80" cy="420" r="4"/><circle cx="1120" cy="420" r="4"/><circle cx="353" cy="120" r="3"/><circle cx="847" cy="120" r="3"/><circle cx="355" cy="720" r="3"/><circle cx="845" cy="720" r="3"/><circle cx="320" cy="610" r="2"/><circle cx="880" cy="230" r="2"/></g>
