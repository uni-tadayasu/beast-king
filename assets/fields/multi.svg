      <circle r="159" stroke-opacity=".29"/><circle r="150" stroke-opacity=".12" stroke-dasharray="2 12" stroke-width="4"/>
      <path d="M0-147 128 74H-128ZM0 147-128-74h256Z" stroke-opacity=".13" stroke-width="2"/>
      <path d="M0-211v31m0 360v31M-211 0h31m360 0h31M-149-149l22 22m254 254 22 22m-298 0 22-22m254-254 22-22" stroke-opacity=".24" stroke-width="2"/>
      <path d="M0-43 43 0 0 43-43 0Z" fill="#75c7e6" fill-opacity=".055" stroke-opacity=".25"/>
    </g>
  </defs>
  <path fill="url(#sky)" d="M0 0h1200v1000H0z"/>
  <path fill="url(#grid)" d="M0 0h1200v1000H0z"/>
  <g fill="none" stroke="#76b4d8" stroke-opacity=".13">
    <path d="M80 0v325l150 95L80 515v485M1120 0v325l-150 95 150 95v485" stroke-width="2"/>
    <path d="M150 0v280l210 140-210 140v440M1050 0v280L840 420l210 140v440"/>
