name: Verify BEAST KING

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check card data and battle rules
        run: npm test
      - name: Verify Worker bundle and database migrations
        run: npm run build
      - name: Check application syntax
        run: node --check app.js

      - name: Test rebuilt game in Chrome
        run: node scripts/rebuild-browser-smoke.mjs

      - name: Verify public delivery (read only, independent of build)
        if: always()
        continue-on-error: true
        run: node scripts/check-public-release.mjs
