name: Verify BEAST KING

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check card data and battle rules
        run: npm test
      - name: Verify Worker bundle and database migrations
        run: npm run build
      - name: Verify every published card illustration
        run: npm run verify:release

      - name: Verify public delivery (read only, independent of build)
        if: always()
        continue-on-error: true
        run: node scripts/check-public-release.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Package public browser files
        run: npm run build:client
      - name: Check application syntax
        id: syntax
        run: node --check app.js && node --check scripts/chrome-smoke-launch.mjs

      - name: Test preserved saves in the packaged game with Chrome
        run: node scripts/rebuild-browser-smoke.mjs dist/client

      - name: Test responsive layouts in the main game with Chrome
        if: ${{ !cancelled() && steps.syntax.outcome == 'success' }}
        run: node scripts/layout-browser-smoke.mjs dist/client
