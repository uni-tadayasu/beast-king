<noscript><main class="noscript"><h1>ビーストキング｜BEAST KING</h1><p>第一弾「六源の覚醒」は1,157枚、第二弾「王源の継承」・第三弾「継承の共鳴」・第四弾「星界の創世」は各1,156枚を収録。通常魔獣2,055枚・合成魔獣514枚・ミラクル1,030枚・ギミック1,026枚、合計4,625枚です。王冠竜レガリアと専用17種は全員が通常パックから入手でき、同じ性能で使えます。四つの弾を組み合わせて編成できます。4種類から選んだ1種類を無料で受け取り、残りは各300秘宝で購入し、秘宝で12枚入りパックを開封してカードを集めるオリジナルブラウザカードゲームです。所持カードからメインデッキ32枚と特殊デッキ4枚を編成し、5,000ハートポイントでCPU対戦・1対1のオンラインルーム・ランクマッチを楽しめます。合成魔獣514枚はアタック型とディフェンス型の両方を兼ね、攻撃時は攻撃力、攻撃されたときは守備力を使います。PC・スマートフォン・タブレットに対応しています。</p><p>ゲームをプレイするにはJavaScriptを有効にしてください。</p><a href="about.html">ゲームの紹介・基本ルール</a></main></noscript>
