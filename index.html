<noscript><main class="noscript"><h1>ビーストキング｜BEAST KING</h1><p>第一弾「六源の覚醒（ろくげんのかくせい）」は、通常魔獣512枚・合成魔獣128枚・ミラクル256枚・ギミック256枚、全1,152枚を収録。8種類のスターターを最初から使い、秘宝で12枚入りパックを開封してカードを集めるオリジナルブラウザカードゲームです。所持カードからメインデッキ32枚と特殊デッキ4枚を編成し、5,000ハートポイントでCPU対戦・1対1のオンラインルーム・ランクマッチを楽しめます。合成魔獣128枚はアタック型とディフェンス型の両方を兼ね、攻撃時は攻撃力、攻撃されたときは守備力を使います。PC・スマートフォン・タブレットに対応しています。</p><p>ゲームをプレイするにはJavaScriptを有効にしてください。</p><a href="about.html">ゲームの紹介・基本ルール</a></main></noscript>
